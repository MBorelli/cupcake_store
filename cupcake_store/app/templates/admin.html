{% extends "base.html" %}
{% block content %}
<h1>Painel Administrativo</h1>
<table>
<tr><th>ID</th><th>Cliente</th><th>Status</th><th>Total</th></tr>
{% for pedido in pedidos %}
<tr>
<td>{{ pedido.id }}</td>
<td>{{ pedido.cliente.username }}</td>
<td>{{ pedido.status }}</td>
<td>R$ {{ pedido.total }}</td>
</tr>
{% endfor %}
</table>
{% endblock %}
